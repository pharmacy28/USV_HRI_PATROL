# ============================================================
# WAM-V 01 传感器配置
# 顺序：摄像头 -> 前扫声纳 -> 红外摄像头 -> 射线雷达
#
# 当前阶段：
# 1. front_camera：真实第一人称 RGB 摄像头
# 2. front_sonar：先用 camera 占位，位置放在 VRX 允许区域内
# 3. ir_camera：先用 camera 占位
# 4. ray_radar：暂时不挂实体，先在控制台占位
# ============================================================

wamv_camera:
  - name: front_camera
    x: 0.75
    y: 0.0
    z: 1.35
    R: 0.0
    P: ${radians(15)}
    Y: 0.0

  - name: front_sonar
    x: 0.95
    y: 0.0
    z: 1.45
    R: 0.0
    P: ${radians(8)}
    Y: 0.0

  - name: ir_camera
    x: 0.80
    y: 0.18
    z: 1.55
    R: 0.0
    P: ${radians(15)}
    Y: 0.0
